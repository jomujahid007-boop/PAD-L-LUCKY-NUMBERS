<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>PAD-L Lucky Number</title>

<style>

body {
  margin: 0;
  background: #07131a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 50px 20px;
}

.logo {
  color: #d8ff4f;
  font-weight: bold;
  letter-spacing: 3px;
  font-size: 18px;
}

h1 {
  font-size: 34px;
  margin: 25px 0 10px;
}

.subtitle {
  color: #a9b8bd;
  margin-bottom: 30px;
}

.box {
  background: #102932;
  border: 1px solid #31515c;
  border-radius: 20px;
  padding: 25px;
}

label {
  display: block;
  margin-bottom: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  box-sizing: border-box;
  background: #07131a;
  border: 1px solid #45636d;
  color: white;
  border-radius: 12px;
  padding: 16px;
  font-size: 20px;
  text-align: center;
  direction: ltr;
}

button {
  width: 100%;
  margin-top: 18px;
  border: 0;
  background: #d8ff4f;
  color: #081017;
  border-radius: 15px;
  padding: 17px;
  font-size: 20px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

.result {
  display: none;
  margin-top: 25px;
  background: #102932;
  border-radius: 20px;
  padding: 25px;
}

.prize {
  color: #d8ff4f;
  font-size: 30px;
  font-weight: bold;
  margin: 20px 0;
}

.code {
  border: 1px dashed #78909a;
  padding: 14px;
  border-radius: 10px;
  direction: ltr;
  letter-spacing: 2px;
  font-weight: bold;
}

.error {
  color: #ff7777;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

  <div class="logo">
    PAD-L SUITES
  </div>

  <h1>
    LUCKY NUMBER 🎾
  </h1>

  <div class="subtitle">
    أدخل رقم جوالك واحصل على فرصتك 🎁
  </div>

  <div class="box">

    <label>
      رقم الجوال
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      placeholder="05XXXXXXXX"
      maxlength="10"
    >

    <button
      id="playButton"
      onclick="playGame()"
    >
      🎁 جرّب حظك
    </button>

  </div>

  <div
    id="result"
    class="result"
  >

    <div id="message"></div>

    <div
      id="prize"
      class="prize"
    ></div>

    <div
      id="code"
      class="code"
    ></div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx1rZMN24iw0fUb02OK4vUyJypqZfuqazDhynNf3CbaBOaFtHDfs6IAnp9WM8dahjEQ/exec";


function playGame() {

  const input =
    document.getElementById("phone");

  const button =
    document.getElementById("playButton");

  const result =
    document.getElementById("result");

  const message =
    document.getElementById("message");

  const prize =
    document.getElementById("prize");

  const code =
    document.getElementById("code");

  const phone =
    input.value.trim();


  if (!/^05\d{8}$/.test(phone)) {

    alert("أدخل رقم جوال سعودي صحيح");

    return;
  }


  button.disabled = true;

  result.style.display = "block";

  message.className = "";

  message.textContent = "جاري الكشف...";

  prize.textContent = "";

  code.textContent = "";


  const callbackName =
    "padlCallback_" +
    Date.now();


  window[callbackName] = function(response) {

    button.disabled = false;


    if (!response || !response.ok) {

      message.className = "error";

      message.textContent =
        response && response.message
          ? response.message
          : "حدث خطأ";

      cleanup();

      return;
    }


    message.textContent =
      "🎉 مبروك!";

    prize.textContent =
      response.prize;

    code.textContent =
      response.code;


    cleanup();
  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?phone=" +
    encodeURIComponent(phone) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    button.disabled = false;

    message.className = "error";

    message.textContent =
      "تعذر الاتصال بالنظام. حاول مرة أخرى.";

    cleanup();
  };


  document.body.appendChild(script);


  function cleanup() {

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }

}

  const input =
    document.getElementById("phone");

  const button =
    document.getElementById("playButton");

  const result =
    document.getElementById("result");

  const message =
    document.getElementById("message");

  const prize =
    document.getElementById("prize");

  const code =
    document.getElementById("code");

  const phone =
    input.value.trim();


  if (!/^05\d{8}$/.test(phone)) {

    alert(
      "أدخل رقم جوال سعودي صحيح"
    );

    return;
  }


  button.disabled = true;

  result.style.display = "block";

  message.className = "";

  message.textContent =
    "جاري الكشف...";

  prize.textContent = "";

  code.textContent = "";


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          phone: phone
        })

      });


    const data =
      await response.json();


    button.disabled = false;


    if (!data || !data.ok) {

      message.className = "error";

      message.textContent =
        data && data.message
          ? data.message
          : "حدث خطأ";

      return;
    }


    message.textContent =
      "🎉 مبروك!";


    prize.textContent =
      data.prize;


    code.textContent =
      data.code;


  } catch (error) {

    button.disabled = false;

    message.className =
      "error";

    message.textContent =
      "تعذر الاتصال بالنظام. حاول مرة أخرى.";

    console.error(error);

  }

}

</script>

</body>

</html>
